# =============================================================================
# OUTPUT MANAGEMENT (optional - uses defaults if not specified)
# =============================================================================
# Controls how command output is truncated and displayed.
# Uncomment and modify to customize:
#
# output_management:
#   enabled: true
#   show_summary: true
#   limits:                    # Character limits per output type
#     list: 5000               # ~1.2K tokens
#     search: 10000            # ~2.5K tokens
#     log: 15000               # ~3.7K tokens
#     json: 20000              # ~5K tokens
#     default: 8000            # ~2K tokens
#   strategies:                # Truncation strategies
#     list: first_only
#     search: first_only
#     log: last_only
#     default: first_last
#   first_ratio: 0.6           # For first_last strategy
#   last_ratio: 0.4
#   cache_max_size_mb: 100

# =============================================================================
# COMMAND TRUST (optional - uses defaults if not specified)
# =============================================================================
# Controls which commands require approval before execution.
# Uncomment and modify to customize:
#
command_trust:
    enabled: true
    yolo_mode: false
    approval_mode: ai_driven
    allowlist:
        - ls
        - pwd
        - git status
    denylist:
        - rm -rf /
        - rm -rf /*
        - rm -rf ~
        - rm -rf ~/*
        - dd if=/dev/zero*
        - dd if=*of=/dev/sd*
        - mkfs*
        - format*
        - "> /dev/sd*"
        - chmod -R 777 /
        - chown -R * /
        - "> /dev/sda"
        - "> /dev/null &"

# =============================================================================
# UPDATE CONFIGURATION (optional - uses defaults if not specified)
# =============================================================================
# Controls automatic update checking behavior.
# Uncomment and modify to customize:
#
update_config:
    check_on_startup: true
# =============================================================================
# SESSION HISTORY (optional - uses defaults if not specified)
# =============================================================================
# Controls session recording and storage.
#
# session_history:
#   enabled: true              # Set false to disable session recording
#   max_storage_mb: 50         # Maximum disk space for session files
