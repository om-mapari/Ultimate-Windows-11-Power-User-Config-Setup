# =============================================================================
# SHELLO CLI USER SETTINGS
# =============================================================================
# Edit this file to customize your settings.
# Only specify values you want to override - defaults are used for the rest.
# See: https://github.com/om-mapari/shello-cli for documentation

# =============================================================================
# PROVIDER CONFIGURATION
# =============================================================================
# Active provider: openai, bedrock
provider: bedrock

# -----------------------------------------------------------------------------
# OpenAI-compatible API
# -----------------------------------------------------------------------------
openai_config:
    provider_type: openai
    api_key: "YOUR_OPENROUTER_API_KEY"
    base_url: https://openrouter.ai/api/v1
    default_model: z-ai/glm-4.5-air:free
    models:
        - anthropic/claude-3.5-sonnet
        - anthropic/claude-3-opus
        - gpt-4o

# -----------------------------------------------------------------------------
# AWS Bedrock (uncomment to configure)
# -----------------------------------------------------------------------------
bedrock_config:
    provider_type: bedrock
    aws_region: ap-south-1
    aws_profile: devom
    default_model: arn:aws:bedrock:ap-south-1:268035794270:inference-profile/global.anthropic.claude-sonnet-4-6
    models:
        - arn:aws:bedrock:ap-south-1:268035794270:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
        - arn:aws:bedrock:ap-south-1:268035794270:inference-profile/global.anthropic.claude-sonnet-4-5-20250929-v1:0
        - arn:aws:bedrock:ap-south-1:268035794270:inference-profile/global.anthropic.claude-sonnet-4-6

# -----------------------------------------------------------------------------
# Remote Server
# -----------------------------------------------------------------------------
remote_server:
    host: 13.126.25.225
    port: 22
    username: ec2user
    password: YOUR_SERVER_PASSWORD

